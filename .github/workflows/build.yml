name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 ninja-build nsis cmake

      - name: Cache OpenCASCADE (MinGW static build)
        uses: actions/cache@v6
        with:
          path: deps/occt-win
          key: occt-7.7.2-mingw-${{ hashFiles('cmake/mingw-w64.cmake') }}

      - name: Build
        run: bash build.sh

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: A3D-STEP-Thumbnails
          path: |
            installer/*-setup.exe
            build-win/stepthumb.dll
            build-win/stepthumb-render.exe
            build-win/test_handler.exe

  test-on-windows:
    needs: windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: A3D-STEP-Thumbnails
          path: dist

      - name: Renderer alone
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          & dist\build-win\stepthumb-render.exe tests\sample-bracket.step out\render.tga 256
          if ($LASTEXITCODE -ne 0) { throw "renderer failed: $LASTEXITCODE" }

      - name: Handler DLL loaded directly
        shell: pwsh
        run: |
          & dist\build-win\test_handler.exe dist\build-win\stepthumb.dll tests\sample-bracket.step out\handler.tga 256
          if ($LASTEXITCODE -ne 0) { throw "handler failed: $LASTEXITCODE" }

      - name: Install silently and ask the Windows Shell (like Explorer)
        continue-on-error: true   # the CI desktop session may lack a full shell
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          Get-ChildItem "C:\Program Files\A3D\STEP Thumbnails"
          $f = (Resolve-Path tests\sample-bracket.step).Path
          & dist\build-win\test_handler.exe --shell $f out\shell.tga 256
          if ($LASTEXITCODE -ne 0) { throw "shell thumbnail failed: $LASTEXITCODE" }

      - name: Uninstall silently
        shell: pwsh
        run: |
          Start-Process "C:\Program Files\A3D\STEP Thumbnails\uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep 3
          if (Test-Path "Registry::HKEY_LOCAL_MACHINE\Software\Classes\CLSID\{AE41D446-CE3B-42C7-9539-7513CF65E803}") { throw "CLSID left behind" }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-thumbnails
          path: out

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-on-windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: A3D-STEP-Thumbnails
          path: dist
      - name: Publish release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/installer/*-setup.exe
